# Project information
sonar.projectKey=salle-reservation
sonar.projectName=Salle Reservation System
sonar.projectVersion=1.0

# Source code location
sonar.sources=user-service/app,salle-service/app,reservation-service/app
sonar.tests=user-service/tests,salle-service/tests,reservation-service/tests

# Python version
sonar.python.version=3.9

# Coverage configuration
sonar.python.coverage.reportPaths=*-coverage.xml
sonar.coverage.exclusions=**/*_test.py,**/tests/**/*,**/migrations/**/*

# Code quality rules
sonar.python.pylint.reportPath=pylint-report.txt

# Quality Gates
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Duplication detection
sonar.cpd.python.minimumLines=5
sonar.cpd.python.minimumTokens=50

# Additional Exclusions
sonar.exclusions=**/migrations/**/*,**/*.pyc,**/__pycache__/**

# Security Rules
sonar.security.enabled=true
sonar.security.hotspots.enabled=true

# Code Complexity
sonar.python.xunit.skipDetails=false
sonar.python.xunit.reportPath=nosetests.xml

# Documentation
sonar.python.docstring.enabled=true
sonar.python.docstring.format=numpy

# Quality Profiles
sonar.profile.python=Sonar way with Security