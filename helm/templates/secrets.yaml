apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
type: Opaque
data:
  # Database secrets
  postgres-password: {{ default "" .Values.postgresql.password | toString | b64enc | quote }}
  
  # SonarQube secrets
  sonarqube-webhook-secret: {{ default "" .Values.sonarqube.webhook.secret | toString | b64enc | quote }}
  
  # Notification secrets
  {{- if .Values.notifications.slack.enabled }}
  slack-webhook-url: {{ default "" .Values.notifications.slack.webhook_url | toString | b64enc | quote }}
  {{- end }}
  {{- if .Values.notifications.teams.enabled }}
  teams-webhook-url: {{ default "" .Values.notifications.teams.webhook_url | toString | b64enc | quote }}
  {{- end }}

  # AWS credentials if CloudWatch is enabled
  {{- if .Values.aws.cloudwatch.enabled }}
  aws-access-key-id: {{ default "" .Values.aws.cloudwatch.accessKeyId | toString | b64enc | quote }}
  aws-secret-access-key: {{ default "" .Values.aws.cloudwatch.secretAccessKey | toString | b64enc | quote }}
  {{- end }}