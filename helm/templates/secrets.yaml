apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
type: Opaque
data:
  # Database secrets
  postgres-password: {{ .Values.postgresql.password | b64enc | quote }}
  
  # SonarQube secrets
  sonarqube-webhook-secret: {{ .Values.sonarqube.webhook.secret | b64enc | quote }}
  
  # Notification secrets
  {{- if .Values.notifications.slack.enabled }}
  slack-webhook-url: {{ .Values.notifications.slack.webhook_url | b64enc | quote }}
  {{- end }}
  {{- if .Values.notifications.teams.enabled }}
  teams-webhook-url: {{ .Values.notifications.teams.webhook_url | b64enc | quote }}
  {{- end }}

  # AWS credentials if CloudWatch is enabled
  {{- if .Values.aws.cloudwatch.enabled }}
  aws-access-key-id: {{ .Values.aws.cloudwatch.accessKeyId | b64enc | quote }}
  aws-secret-access-key: {{ .Values.aws.cloudwatch.secretAccessKey | b64enc | quote }}
  {{- end }}