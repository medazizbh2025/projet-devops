{{- define "common.deployment" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels:
    app: {{ .name }}
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: {{ .replicas }}
  selector:
    matchLabels:
      app: {{ .name }}
  template:
    metadata:
      labels:
        app: {{ .name }}
    spec:
      containers:
      - name: {{ .name }}
        image: {{ .image }}:{{ $.Values.imageTag | default "latest" }}
        ports:
        - containerPort: {{ .port }}
        env:
        - name: NOTIFICATION_LEVEL
          valueFrom:
            configMapKeyRef:
              name: {{ $.Release.Name }}-config
              key: NOTIFICATION_LEVEL
        resources:
{{ toYaml .resources | indent 10 }}
{{- end }}

{{- if .Values.userService }}
---
{{- $serviceValues := merge (dict "name" .Values.userService.name "replicas" .Values.userService.replicas "image" .Values.userService.image "port" .Values.userService.port "resources" .Values.userService.resources) (dict "Values" .Values "Release" .Release) }}
{{- include "common.deployment" $serviceValues | nindent 0 }}
{{- end }}

{{- if .Values.salleService }}
---
{{- $serviceValues := merge (dict "name" .Values.salleService.name "replicas" .Values.salleService.replicas "image" .Values.salleService.image "port" .Values.salleService.port "resources" .Values.salleService.resources) (dict "Values" .Values "Release" .Release) }}
{{- include "common.deployment" $serviceValues | nindent 0 }}
{{- end }}

{{- if .Values.reservationService }}
---
{{- $serviceValues := merge (dict "name" .Values.reservationService.name "replicas" .Values.reservationService.replicas "image" .Values.reservationService.image "port" .Values.reservationService.port "resources" .Values.reservationService.resources) (dict "Values" .Values "Release" .Release) }}
{{- include "common.deployment" $serviceValues | nindent 0 }}
{{- end }}