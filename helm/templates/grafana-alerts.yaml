{{- if .Values.monitoring.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerts
data:
  alerts.yaml: |
    groups:
      - name: ServiceAlerts
        rules:
          - alert: HighErrorRate
            expr: sum(rate(http_requests_total{status=~"5.*"}[5m])) by (service) / sum(rate(http_requests_total[5m])) by (service) > 0.1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: High error rate detected
              description: "{{ `Service {{ $labels.service }} has high error rate (>10%)` }}"

          - alert: HighLatency
            expr: rate(http_request_duration_seconds_sum[5m]) / rate(http_request_duration_seconds_count[5m]) > 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: High latency detected
              description: "{{ `Service {{ $labels.service }} is experiencing high latency (>1s)` }}"

          - alert: ServiceDown
            expr: up == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: Service is down
              description: "{{ `Service {{ $labels.service }} is down` }}"
{{- end }}