{{- if and .Values.monitoring.grafana.enabled .Values.sonarqube.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-sonarqube
data:
  sonarqube-metrics.json: |
    {
      "dashboard": {
        "title": "SonarQube Metrics",
        "panels": [
          {
            "title": "Code Issues by Severity",
            "type": "graph",
            "datasource": "Prometheus",
            "targets": [
              {
                "expr": "sonarqube_issues_total",
                "legendFormat": "{{ `{{severity}}` }}"
              }
            ]
          },
          {
            "title": "Code Coverage",
            "type": "gauge",
            "datasource": "Prometheus",
            "targets": [
              {
                "expr": "sonarqube_coverage_percentage",
                "legendFormat": "{{ `{{project}}` }}"
              }
            ]
          },
          {
            "title": "Technical Debt",
            "type": "graph",
            "datasource": "Prometheus",
            "targets": [
              {
                "expr": "sonarqube_technical_debt_minutes",
                "legendFormat": "{{ `{{project}}` }}"
              }
            ]
          }
        ]
      }
    }
{{- end }}