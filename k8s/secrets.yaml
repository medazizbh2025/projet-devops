apiVersion: v1
kind: Secret
metadata:
  name: db-secrets
type: Opaque
stringData:
  postgres-user: postgres
  postgres-password: ${DB_PASSWORD}
  user-db-url: postgresql://postgres:${DB_PASSWORD}@postgresql:5432/user-service
  salle-db-url: postgresql://postgres:${DB_PASSWORD}@postgresql:5432/salle-service
  reservation-db-url: postgresql://postgres:${DB_PASSWORD}@postgresql:5432/reservation-service
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  jwt-secret: ${JWT_SECRET}
  google-client-id: ${GOOGLE_CLIENT_ID}
  google-client-secret: ${GOOGLE_CLIENT_SECRET}
---
apiVersion: v1
kind: Secret
metadata:
  name: sonar-secrets
  labels:
    app: reservation-system
type: Opaque
stringData:
  sonar-db-password: "${SONAR_DB_PASSWORD}"